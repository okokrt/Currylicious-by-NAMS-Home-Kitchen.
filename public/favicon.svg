<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#C05621" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FDE68A" stroke-width="8" stroke-opacity="0.3" />

  <!-- Steam Vectors -->
  <path d="M 190 140 Q 205 100 190 70" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <path d="M 256 125 Q 275 85 256 55" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95" />
  <path d="M 322 140 Q 337 100 322 70" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />

  <!-- Curry Bowl / Handled Vessel -->
  <g filter="url(#shadow)">
    <!-- Bowl Base Shadow/Rim -->
    <path d="M 112 250 C 112 370, 400 370, 400 250 Z" fill="#9A3412" />
    <!-- Bowl Main -->
    <path d="M 120 240 C 120 350, 392 350, 392 240 Z" fill="url(#bgGrad)" stroke="#FDE68A" stroke-width="6" />
    <!-- Delicious Curry Content -->
    <ellipse cx="256" cy="240" rx="130" ry="30" fill="url(#goldGrad)" />
    <!-- Spice Garnish / Herb Leaves -->
    <circle cx="230" cy="235" r="7" fill="#15803D" />
    <circle cx="245" cy="242" r="9" fill="#166534" />
    <circle cx="270" cy="238" r="6" fill="#15803D" />
    <circle cx="285" cy="245" r="5" fill="#B91C1C" />
  </g>

  <!-- Handles -->
  <path d="M 120 250 C 80 250, 80 280, 120 280" fill="none" stroke="#FDE68A" stroke-width="12" stroke-linecap="round" />
  <path d="M 392 250 C 432 250, 432 280, 392 280" fill="none" stroke="#FDE68A" stroke-width="12" stroke-linecap="round" />

  <!-- App Title Banner / C Motif -->
  <text x="256" y="425" text-anchor="middle" fill="#FFFBEB" font-family="'Georgia', serif" font-weight="bold" font-size="52" letter-spacing="2">CURRYLICIOUS</text>
  <text x="256" y="458" text-anchor="middle" fill="#FDE68A" font-family="sans-serif" font-weight="600" font-size="22" letter-spacing="3">HOME KITCHEN</text>
</svg>
